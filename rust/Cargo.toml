[package]
name = "godot_wry"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]  # Compile this crate to a dynamic C library.

[dependencies]
godot = { git = "https://github.com/godot-rust/gdext", branch = "master", features = ["api-4-2", "experimental-threads"]}
raw-window-handle = "0.6.2"
wry = { version = "0.50.4", features = ["transparent", "devtools"] }
http = "1.1.0"
lazy_static = "1.5.0"
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.1"
x11-dl = "2.21.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.1", features = ["Win32", "Win32_UI", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Diagnostics_Etw"]}

# Android — ndk-context provides the global AndroidContext (JavaVM* + jobject Activity)
# that WRY's Android backend reads via ndk_context::android_context().
# WRY 0.50.4 already vendors `jni ^0.21` and `ndk ^0.9` internally for Android,
# so we only need this one crate for our own Activity-pointer registration.
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21.1"
ndk = "0.9"
ndk-sys = "0.6.0"

# iOS — unlike Android, WRY's iOS backend DOES use a real window handle
# (a `UIView*` wrapped in `raw_window_handle::UiKitWindowHandle`), so no
# `*_setup()` call is required. We only need `objc2` to reach into the live
# UIKit view tree for "view grafting": bringing WRY's WKWebView to the front
# of Godot's `godotView` and forcing a transparent background so the Metal/GL
# 3D scene shows through. `objc2 = 0.6` matches the version WRY 0.50.4 already
# pulls in on Apple platforms, so this adds no duplicate objc runtime.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[build-dependencies]
# Required for WRY's Android build step: generates the Kotlin/Java glue files
# (WryActivity.kt, etc.) that must be included in the Android APK's source set.
# See: WRY_ANDROID_PACKAGE / WRY_ANDROID_LIBRARY / WRY_ANDROID_KOTLIN_FILES_OUT_DIR
# environment variables, which must be set before cross-compiling.
